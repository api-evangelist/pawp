name: Pawp
description: 'Pawp is a veterinary telemedicine membership service that gives pet owners 24/7 access
  to licensed veterinary professionals via text, video, and phone. For a flat annual membership, members
  get unlimited on-demand consultations with vets, nurses, and technicians who each carry a minimum of
  five years of clinical experience, along with personalized care plans and follow-up guidance for both
  emergencies and routine questions. Pawp operates as a consumer mobile app (iOS and Android) with no
  public developer API, SDK, or partner integration surface. It was surfaced as a portfolio company of
  dcm-ventures and lux-capital and added to the API Evangelist network for enrichment.'
